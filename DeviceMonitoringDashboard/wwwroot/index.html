<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device monitoring</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--ink:#16202b;--muted:#5b6877;--line:#d9dfe6;--on:#0b7a5a;--off:#b42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--surface:#171e26;--ink:#e6ebf0;--muted:#93a1b0;--line:#26303b;--on:#3dd6a3;--off:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
header h1{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.tools{display:flex;align-items:center;gap:12px}
button{font:inherit;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.hero{padding:40px 0 28px}
.count{margin:0;font-size:clamp(34px,7vw,60px);line-height:1.1;font-weight:300;letter-spacing:-.02em}
.count b{font-weight:700;color:var(--on)}
.count.bad b{color:var(--off)}
.strip{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 10px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--off)}
.pip.on{background:var(--on);border-color:var(--on)}
.sub{margin:0;color:var(--muted)}
.banner{margin:0 0 16px;padding:10px 14px;border:1px solid var(--off);border-radius:6px;color:var(--off)}
.list{margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:1.2fr 1fr 1.5fr 1fr 1fr .8fr;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{color:var(--muted);font-size:13px;padding-top:10px;padding-bottom:10px}
.name{font-weight:600}
.num,.addr{font-variant-numeric:tabular-nums}
.addr{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--on)}
.off .status{color:var(--off)}
.off .dot{background:transparent;border:2px solid var(--off)}
.note{grid-column:1/-1;color:var(--muted);font-size:14px}
.empty{padding:28px 18px;color:var(--muted)}
@media (max-width:720px){
  .head{display:none}
  .row{grid-template-columns:1fr 1fr}
  .row [data-label]::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;font-weight:400}
  .row .name,.row .status{grid-column:auto}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Device monitoring</h1>
    <div class="tools">
      <span id="checked" aria-live="off">Checking…</span>
      <button id="refresh" type="button">Refresh now</button>
    </div>
  </header>

  <section class="hero" aria-live="polite">
    <p class="count" id="count"><b id="online">–</b> of <span id="total">–</span> devices online</p>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <p class="sub" id="sub"></p>
  </section>

  <p class="banner" id="error" role="alert" hidden>The dashboard service is not answering. Retrying every 5 seconds.</p>

  <ul class="list" id="list"></ul>
</main>

<script>
const $ = id => document.getElementById(id);

function formatUptime(s) {
  if (s == null || s <= 0) return "n/a";
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m}m ${s % 60}s`;
}
const formatTemp = t => (t == null || t <= 0) ? "n/a" : `${t.toFixed(1)} °C`;

function cell(label, text, cls) {
  const el = document.createElement("div");
  el.dataset.label = label;
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

function headRow() {
  const li = document.createElement("li");
  li.className = "row head";
  for (const t of ["Device", "Status", "Address", "Uptime", "Temperature", "Reply"]) {
    const d = document.createElement("div");
    d.textContent = t;
    li.append(d);
  }
  return li;
}

function deviceRow(d) {
  const li = document.createElement("li");
  li.className = "row" + (d.online ? "" : " off");

  const status = cell("Status", "", "status");
  const dot = document.createElement("span");
  dot.className = "dot";
  status.append(dot, d.online ? "Online" : "Offline");

  li.append(
    cell("Device", d.name, "name"),
    status,
    cell("Address", d.online ? (d.address || d.url) : d.url, "addr"),
    cell("Uptime", d.online ? formatUptime(d.uptimeSeconds) : "–", "num"),
    cell("Temperature", d.online ? formatTemp(d.temperatureC) : "–", "num"),
    cell("Reply", d.responseMs != null ? `${d.responseMs} ms` : "–", "num")
  );
  if (!d.online && d.error) {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = d.error;
    li.append(note);
  }
  return li;
}

function render(data) {
  $("online").textContent = data.online;
  $("total").textContent = data.total;
  $("count").classList.toggle("bad", data.total > 0 && data.online < data.total);

  const strip = $("strip");
  strip.replaceChildren(...data.devices.map(d => {
    const pip = document.createElement("span");
    pip.className = "pip" + (d.online ? " on" : "");
    return pip;
  }));

  const offline = data.devices.filter(d => !d.online).map(d => d.name);
  $("sub").textContent = data.total === 0
    ? "Add device addresses to DeviceMonitoringDashboard/appsettings.json."
    : offline.length ? `Offline: ${offline.join(", ")}` : "All devices are answering.";

  const list = $("list");
  if (data.total === 0) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No devices configured yet.";
    list.replaceChildren(li);
  } else {
    list.replaceChildren(headRow(), ...data.devices.map(deviceRow));
  }
  $("checked").textContent = "Last checked " + new Date(data.checkedAt).toLocaleTimeString();
}

async function load() {
  try {
    const response = await fetch("/api/devices", { cache: "no-store" });
    if (!response.ok) throw new Error(response.status);
    render(await response.json());
    $("error").hidden = true;
  } catch {
    $("error").hidden = false;
  }
}

$("refresh").addEventListener("click", load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
